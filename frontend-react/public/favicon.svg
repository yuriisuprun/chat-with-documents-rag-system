<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Purple gradient background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  
  <!-- Document icon (simplified chat bubble + document) -->
  <g transform="translate(50, 50)">
    <!-- Document page -->
    <rect x="-15" y="-20" width="24" height="28" rx="2" fill="white" opacity="0.9"/>
    
    <!-- Document lines -->
    <line x1="-10" y1="-12" x2="5" y2="-12" stroke="#5B21B6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-10" y1="-5" x2="5" y2="-5" stroke="#5B21B6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-10" y1="2" x2="5" y2="2" stroke="#5B21B6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Chat bubble indicator -->
    <circle cx="12" cy="12" r="8" fill="#A78BFA" opacity="0.8"/>
    <path d="M 12 16 L 10 20 L 14 16" fill="#A78BFA" opacity="0.8"/>
  </g>
</svg>
