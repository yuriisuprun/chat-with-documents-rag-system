[pytest]
# Pytest configuration for Chat With Documents

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Directory with tests
testpaths = backend/tests

# Minimum Python version
minversion = 7.0

# Add command line options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for test organization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    asyncio: Async tests

# Coverage options
[coverage:run]
branch = True
source = backend/app
omit =
    */tests/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
