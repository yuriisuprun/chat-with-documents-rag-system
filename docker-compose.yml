services:
  # PostgreSQL Database with pgvector
  db:
    image: ankane/pgvector:v0.5.1
    container_name: whatsapp_db
    environment:
      POSTGRES_USER: ${DB_USER:-assistant_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-assistant_password}
      POSTGRES_DB: ${DB_NAME:-whatsapp_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init_pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-assistant_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: whatsapp_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-assistant_user}:${DB_PASSWORD:-assistant_password}@db:5432/${DB_NAME:-whatsapp_assistant}
      POSTGRES_USER: ${DB_USER:-assistant_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-assistant_password}
      POSTGRES_DB: ${DB_NAME:-whatsapp_assistant}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-True}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - whatsapp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_celery_worker
    environment:
      DATABASE_URL: postgresql://${DB_USER:-assistant_user}:${DB_PASSWORD:-assistant_password}@db:5432/${DB_NAME:-whatsapp_assistant}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      - db
      - redis
      - backend
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    command: celery -A app.tasks worker --loglevel=info --concurrency=4
    networks:
      - whatsapp_network

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_celery_beat
    environment:
      DATABASE_URL: postgresql://${DB_USER:-assistant_user}:${DB_PASSWORD:-assistant_password}@db:5432/${DB_NAME:-whatsapp_assistant}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      - db
      - redis
      - backend
    volumes:
      - ./backend:/app
    command: celery -A app.tasks beat --loglevel=info
    networks:
      - whatsapp_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whatsapp_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8000/api/v1
    networks:
      - whatsapp_network

networks:
  whatsapp_network:
    driver: bridge

volumes:
  postgres_data:
