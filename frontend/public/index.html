<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding and viewport -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, user-scalable=yes"
    />
    
    <!-- Mobile theme colors -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WhatsApp AI" />
    
    <!-- Meta description -->
    <meta
      name="description"
      content="WhatsApp AI Auto-Responder Admin Dashboard - Manage conversations, documents, and AI responses"
    />
    
    <!-- Preload critical fonts for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    
    <!-- Favicon for browser tabs -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.svg" />
    
    <!-- Icons for mobile home screen -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%232563eb' width='180' height='180'/><text x='50%' y='50%' font-size='80' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>W</text></svg>" />
    
    <!-- Manifest for PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Page title -->
    <title>WhatsApp Assistant - Admin Dashboard</title>
  </head>
  <body>
    <noscript>
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; background: #f9fafb;">
        <div style="text-align: center; padding: 2rem;">
          <h1 style="font-size: 1.5rem; color: #111827; margin-bottom: 0.5rem;">JavaScript Required</h1>
          <p style="color: #6b7280;">Please enable JavaScript to use WhatsApp AI Assistant Admin Dashboard.</p>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
